<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재고 관리 — 서촌 / 블랙 / 레드 / 작업실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fafaf9;--surface:#ffffff;--surface2:#f4f3f0;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --text:#1a1917;--text2:#6b6a67;--text3:#a09e9a;
  --accent:#1a1917;--r:10px;--rl:14px;
  --c0:#7F77DD;--c1:#2C2C2A;--c2:#D85A30;--c3:#1D9E75;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--surface:#1c1c1a;--surface2:#242422;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
  --text:#f0ede8;--text2:#a09e9a;--text3:#6b6a67;--accent:#f0ede8;
}}
body{background:var(--bg);color:var(--text);min-height:100vh;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;}
.wrap{max-width:1020px;margin:0 auto;padding:20px 16px 80px;}

/* 헤더 */
header{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.logo{font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px;margin-right:auto;}
.hactions{display:flex;gap:8px;flex-wrap:wrap;}

/* 버튼 */
button{cursor:pointer;font-family:inherit;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;transition:background .15s;}
.btn:hover{background:var(--surface2);}
.btn.primary{background:var(--accent);color:var(--bg);border-color:transparent;}
.btn.primary:hover{opacity:.85;}
.ib{width:26px;height:26px;border-radius:var(--r);border:1px solid var(--border);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:13px;transition:background .15s;}
.ib:hover{background:var(--surface2);color:var(--text);}

/* 탭 */
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:var(--rl);padding:4px;width:fit-content;margin-bottom:18px;}
.tab{padding:6px 16px;border-radius:9px;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* 요약 카드 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;border-top:3px solid var(--bc);}
.sc-name{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.sc-dot{width:8px;height:8px;border-radius:50%;background:var(--bc);}
.sc-num{font-size:26px;font-weight:600;line-height:1;}
.sc-sub{font-size:11px;color:var(--text3);margin-top:4px;}

/* 툴바 */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.sw{position:relative;}
.sw i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none;}
.sw input{padding:7px 12px 7px 32px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;width:220px;}
select{padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;}

/* 테이블 */
.twrap{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.thead{display:grid;grid-template-columns:2.2fr repeat(4,1fr) 80px;background:var(--surface2);border-bottom:1px solid var(--border);}
.th{padding:10px 14px;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;}
.th.bc{text-align:center;border-left:3px solid var(--bcolor);}
.prow{display:grid;grid-template-columns:2.2fr repeat(4,1fr) 80px;border-top:1px solid var(--border);background:var(--surface);transition:background .12s;}
.prow:hover{background:var(--surface2);}
.td{padding:9px 14px;display:flex;align-items:center;border-right:1px solid var(--border);}
.td:last-child{border-right:none;}
.td.c{justify-content:center;}
.pinfo{display:flex;align-items:center;gap:10px;min-width:0;}
.pthumb{width:38px;height:38px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;}
.pthumb img{width:100%;height:100%;object-fit:cover;}
.pthumb:hover .ov{opacity:1;}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;border-radius:var(--r);}
.ov i{color:#fff;font-size:14px;}
.pname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmeta{font-size:10px;color:var(--text3);margin-top:2px;font-family:monospace;}
.pcat{font-size:10px;color:var(--text2);}
.scell{display:flex;flex-direction:column;align-items:center;gap:3px;}
.snum{font-size:14px;font-weight:500;padding:2px 8px;border-radius:5px;cursor:pointer;min-width:34px;text-align:center;}
.snum:hover{background:rgba(56,138,221,.12);color:#185FA5;}
.snum-in{border:none;outline:none;width:46px;text-align:center;font-size:14px;font-weight:500;font-family:inherit;background:transparent;color:var(--text);}
.sbar{width:34px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.sbar-f{height:100%;border-radius:2px;transition:width .3s;}
.low-b{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;background:#FCEBEB;color:#791F1F;}
.actcell{display:flex;gap:3px;justify-content:center;}

/* 페이지네이션 */
.pagi{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--surface2);border-top:1px solid var(--border);font-size:12px;color:var(--text2);}
.pagi-btns{display:flex;gap:4px;}
.pbtn{padding:3px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;}
.pbtn:hover{background:var(--surface2);}
.pbtn.on{background:var(--accent);color:var(--bg);border-color:transparent;}

/* 패널 */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.5rem;max-width:500px;}
.fl{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;margin-top:12px;}
.fl:first-child{margin-top:0;}
.fi{width:100%;font-size:13px;padding:7px 10px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);}
.from-to{display:flex;align-items:flex-end;gap:8px;margin-top:12px;}
.from-to>div{flex:1;}
.arr{font-size:18px;color:var(--text2);padding-bottom:8px;flex-shrink:0;}
.prev-txt{font-size:12px;color:var(--text2);margin-top:6px;min-height:18px;}
.prev-txt.err{color:#E24B4A;}
.rprev{margin-top:10px;padding:10px 14px;border-radius:var(--r);background:#EAF3DE;border:1px solid #97C459;font-size:12px;color:#27500A;display:none;}
.rprev.show{display:block;}

/* 이력 */
.log-item{display:flex;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:6px;font-size:13px;}
.log-ic{flex-shrink:0;width:28px;height:28px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:14px;}
.log-ic.receive{background:#EAF3DE;color:#27500A;}
.log-ic.transfer{background:#E6F1FB;color:#0C447C;}
.log-ic.edit{background:#F1EFE8;color:#444441;}
.log-body{flex:1;color:var(--text2);line-height:1.5;}
.log-body strong{color:var(--text);}
.log-time{font-size:10px;color:var(--text3);margin-top:3px;font-family:monospace;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:24px;width:380px;max-width:100%;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px;}
.msub{font-size:13px;color:var(--text2);margin-bottom:14px;}
.mrow{display:flex;gap:8px;margin-top:16px;}
.mrow button{flex:1;}
.sec-btn{padding:7px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px;}
.g4 label{font-size:11px;font-weight:600;display:block;margin-bottom:2px;}
.g4 input{width:100%;font-size:13px;padding:5px 4px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);color:var(--text);text-align:center;}

/* 이미지 업로드 */
.img-tabs{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.img-tab{flex:1;padding:6px;font-size:12px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--text2);}
.img-tab.active{background:var(--surface2);color:var(--text);}
.dropzone{border:1px dashed var(--border2);border-radius:var(--rl);overflow:hidden;cursor:pointer;position:relative;background:var(--surface2);margin-top:4px;}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.dz-ph{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;color:var(--text2);font-size:12px;text-align:center;}
.dz-ph i{font-size:26px;}
.dz-pw{position:relative;}
.dz-pw img{width:100%;max-height:160px;object-fit:contain;display:block;background:var(--surface2);}
.dz-pw .rm{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;}

/* 알림 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);padding:10px 20px;border-radius:var(--r);font-size:13px;font-weight:500;transition:transform .25s;z-index:300;white-space:nowrap;border:1px solid;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* 스피너 */
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:3rem;color:var(--text2);font-size:14px;}
.empty{padding:2.5rem;text-align:center;color:var(--text2);font-size:13px;}

/* 설정 배너 */
.setup{background:#FAEEDA;border:1px solid #EF9F27;border-radius:var(--rl);padding:14px 18px;margin-bottom:18px;font-size:13px;color:#633806;line-height:1.7;}
.setup code{background:rgba(0,0,0,0.08);padding:2px 6px;border-radius:4px;font-family:monospace;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><i class="ti ti-building-store"></i> 재고 관리</div>
  <div class="hactions">
    <button class="btn" onclick="loadData()"><i class="ti ti-refresh"></i> 새로고침</button>
    <button class="btn primary" onclick="openAddModal()"><i class="ti ti-plus"></i> 상품 추가</button>
  </div>
</header>

<div class="setup" id="setupBanner" style="display:none">
  <strong>⚙️ 설정 필요</strong> — 이 파일 상단의 <code>SCRIPT_URL</code> 변수에 Apps Script 웹앱 URL을 입력하세요.<br>
  Apps Script → 배포 → 웹 앱 → URL 복사 → 아래 코드에 붙여넣기
</div>

<div class="summary" id="summaryCards"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('stock',this)"><i class="ti ti-layout-grid"></i> 재고 현황</button>
  <button class="tab" onclick="switchTab('receive',this)"><i class="ti ti-package-import"></i> 입고</button>
  <button class="tab" onclick="switchTab('transfer',this)"><i class="ti ti-transfer"></i> 이동</button>
  <button class="tab" onclick="switchTab('log',this)"><i class="ti ti-clock"></i> 이력</button>
</div>

<!-- 재고 현황 -->
<div id="tab-stock">
  <div class="toolbar">
    <div class="sw">
      <i class="ti ti-search"></i>
      <input id="searchInput" placeholder="상품명 / SKU / 바코드..." oninput="goPage(1);renderStock()">
    </div>
    <select id="catFilter" onchange="goPage(1);renderStock()">
      <option value="">전체 카테고리</option>
      <option>Diary</option><option>Note</option><option>Bag</option>
      <option>Masking Tape</option><option>Leather Goods</option>
      <option>Paper Goods</option><option>Other Goods</option>
    </select>
  </div>
  <div class="twrap">
    <div class="thead">
      <div class="th">상품</div>
      <div class="th bc" style="--bcolor:var(--c0)">서촌</div>
      <div class="th bc" style="--bcolor:var(--c1)">블랙</div>
      <div class="th bc" style="--bcolor:var(--c2)">레드</div>
      <div class="th bc" style="--bcolor:var(--c3)">작업실</div>
      <div class="th" style="text-align:center">액션</div>
    </div>
    <div id="productList"><div class="loading"><div class="spinner"></div> 불러오는 중...</div></div>
    <div class="pagi" id="pagiBar" style="display:none"></div>
  </div>
</div>

<!-- 입고 -->
<div id="tab-receive" style="display:none">
  <div class="panel">
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">입고 수량이 해당 지점 재고에 더해집니다.</p>
    <label class="fl">상품 선택</label>
    <select id="rProduct" class="fi" onchange="updateRPrev()"></select>
    <label class="fl">입고 지점</label>
    <select id="rBranch" class="fi" onchange="updateRPrev()">
      <option value="0">서촌</option><option value="1">블랙</option>
      <option value="2">레드</option><option value="3">작업실</option>
    </select>
    <label class="fl">입고 수량</label>
    <div style="display:flex;align-items:center;gap:10px;">
      <input type="number" id="rQty" min="1" value="10" class="fi" style="width:120px;" oninput="updateRPrev()">
      <span id="rCur" style="font-size:12px;color:var(--text2);"></span>
    </div>
    <div class="rprev" id="rPrev"><div id="rPrevBody"></div></div>
    <label class="fl">납품처 / 메모 (선택)</label>
    <input type="text" id="rMemo" class="fi" placeholder="예: 본사 창고 발주, 정기 발주...">
    <button class="btn primary" style="margin-top:14px;width:100%;justify-content:center;" onclick="processReceive()">
      <i class="ti ti-package-import"></i> 입고 처리
    </button>
  </div>
</div>

<!-- 이동 -->
<div id="tab-transfer" style="display:none">
  <div class="panel">
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">지점 간 재고를 이동합니다.</p>
    <label class="fl">상품 선택</label>
    <select id="tProduct" class="fi" onchange="updateTPrev()"></select>
    <div class="from-to">
      <div>
        <label class="fl" style="margin-top:0">출발 지점</label>
        <select id="tFrom" class="fi" onchange="updateTPrev()">
          <option value="0">서촌</option><option value="1">블랙</option>
          <option value="2">레드</option><option value="3">작업실</option>
        </select>
      </div>
      <i class="ti ti-arrow-right arr"></i>
      <div>
        <label class="fl" style="margin-top:0">도착 지점</label>
        <select id="tTo" class="fi" onchange="updateTPrev()">
          <option value="1">블랙</option><option value="0">서촌</option>
          <option value="2">레드</option><option value="3">작업실</option>
        </select>
      </div>
    </div>
    <label class="fl">이동 수량</label>
    <div style="display:flex;align-items:center;gap:10px;">
      <input type="number" id="tQty" min="1" value="1" class="fi" style="width:120px;" oninput="updateTPrev()">
      <span class="prev-txt" id="tPrev"></span>
    </div>
    <label class="fl">메모 (선택)</label>
    <input type="text" id="tMemo" class="fi" placeholder="이동 사유...">
    <button class="btn primary" style="margin-top:14px;width:100%;justify-content:center;" onclick="processTransfer()">
      <i class="ti ti-transfer"></i> 이동 처리
    </button>
  </div>
</div>

<!-- 이력 -->
<div id="tab-log" style="display:none">
  <div id="logList"><div class="empty">이력이 없습니다.</div></div>
</div>

<div id="modalContainer"></div>
<div class="toast" id="toast"></div>

</div><!-- /wrap -->

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ★ Apps Script 웹앱 URL을 여기에 붙여넣으세요 ★
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const SCRIPT_URL = 'const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzgZfcQUIEuDhEfR8O-ggGktXZbanobu0z0cAk1CK7ioqWsOKTMGvyT5e6HiLBoB48Q6g/exec';
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const BRANCHES = ['서촌','블랙','레드','작업실'];
const BC       = ['var(--c0)','var(--c1)','var(--c2)','var(--c3)'];
const BC_HEX   = ['#7F77DD','#2C2C2A','#D85A30','#1D9E75'];
const CATS     = ['Diary','Note','Bag','Masking Tape','Leather Goods','Paper Goods','Other Goods'];
const CAT_EMOJI= {Diary:'📅',Note:'📓',Bag:'👜','Masking Tape':'🎀','Leather Goods':'🧳','Paper Goods':'📄','Other Goods':'📦'};
const PAGE_SIZE = 30;

let products = [];
let logs     = [];
let curPage  = 1;
let curTab   = 'stock';
let isDemo   = false;

// ── 데이터 로드 ──────────────────────────────────────────
async function loadData() {
  if (SCRIPT_URL === 'YOUR_SCRIPT_URL_HERE') {
    document.getElementById('setupBanner').style.display = 'block';
    isDemo = true;
    loadDemoData();
    return;
  }
  document.getElementById('productList').innerHTML = '<div class="loading"><div class="spinner"></div> 불러오는 중...</div>';
  try {
    const res  = await fetch(SCRIPT_URL + '?action=getAll');
    const data = await res.json();
    if (data.ok) {
      products = data.products;
      renderAll();
      toast('데이터를 불러왔습니다 ✓', 'success');
    } else {
      showError(data.error);
    }
  } catch(e) {
    isDemo = true;
    loadDemoData();
    toast('서버 연결 실패 — 데모 모드로 실행됩니다', 'warn');
  }
}

function loadDemoData() {
  // 253개 상품 기본 데이터 (재고 0으로 초기화)
  const raw = [
    [1,"1y diary solid · Citron","Diary","OnNqUMQN","2995358325671",16000,"📅"],
    [2,"1y diary solid · Vivid Pink","Diary","fNpbjpDr","3152302377208",16000,"📅"],
    [3,"1y diary solid · Flame","Diary","TPgoyuJn","8050156978476",16000,"📅"],
    [4,"1y diary solid · Mint","Diary","xHY4MLlK","7926200988149",16000,"📅"],
    [5,"1y diary solid · Red","Diary","n1Xag0Hb","9717668844595",16000,"📅"],

// ── API ──────────────────────────────────────────────────
async function api(body) {
  if (isDemo) { toast('데모 모드 — URL 설정 후 실제 저장됩니다', 'warn'); return null; }
  try {
    const res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(body) });
    return await res.json();
  } catch(e) { toast('서버 연결 실패', 'err'); return null; }
}

// ── 렌더링 ───────────────────────────────────────────────
function renderAll() { renderSummary(); renderStock(); }

function renderSummary() {
  const BC_VALS = ['var(--c0)','var(--c1)','var(--c2)','var(--c3)'];
  document.getElementById('summaryCards').innerHTML = BRANCHES.map((b,i) => {
    const total = products.reduce((s,p) => s + p.stock[i], 0);
    const low   = products.filter(p => p.stock[i] <= p.low && p.stock[i] >= 0).length;
    return `<div class="sc" style="--bc:${BC_HEX[i]}">
      <div class="sc-name"><span class="sc-dot"></span>${b}</div>
      <div class="sc-num">${total.toLocaleString()}</div>
      <div class="sc-sub">${products.length}종${low ? ` · <span style="color:#E24B4A;font-weight:600">부족 ${low}종</span>` : ''}</div>
    </div>`;
  }).join('');
}

function getFiltered() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  return products.filter(p =>
    (!q  || p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.barcode||'').includes(q)) &&
    (!cat || p.category === cat)
  );
}

function goPage(n) { curPage = n; }

function renderStock() {
  const filtered    = getFiltered();
  const totalCount  = filtered.length;
  const totalPages  = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
  if (curPage > totalPages) curPage = totalPages;
  const start = (curPage - 1) * PAGE_SIZE;
  const page  = filtered.slice(start, start + PAGE_SIZE);
  const el    = document.getElementById('productList');
  const bar   = document.getElementById('pagiBar');

  if (!page.length) {
    el.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    bar.style.display = 'none';
    return;
  }

  const maxS = BRANCHES.map((_,i) => Math.max(...products.map(p => p.stock[i]), 1));

  el.innerHTML = page.map(p => {
    const thumb = p.imgUrl ? `<img src="${p.imgUrl}" alt="">` : `<span style="font-size:17px">${p.emoji}</span>`;
    const cells = BRANCHES.map((_,i) => {
      const s   = p.stock[i];
      const pct = Math.min(100, Math.round(s / maxS[i] * 100));
      const fc  = pct < 20 ? '#E24B4A' : pct < 40 ? '#EF9F27' : '#1D9E75';
      return `<div class="td c">
        <div class="scell">
          <span class="snum" onclick="editStock(${p.id},${i},this)">${s}</span>
          <div class="sbar"><div class="sbar-f" style="width:${pct}%;background:${fc}"></div></div>
          ${s <= p.low ? '<span class="low-b">부족</span>' : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="prow" id="row-${p.id}">
      <div class="td">
        <div class="pinfo">
          <div class="pthumb" onclick="openImgModal(${p.id})" title="이미지 변경">
            ${thumb}<div class="ov"><i class="ti ti-camera"></i></div>
          </div>
          <div style="min-width:0">
            <div class="pname" title="${p.name}">${p.name}</div>
            <div class="pmeta">${p.sku}  ${p.barcode}</div>
            <div class="pcat">${p.category} · ${p.price.toLocaleString()}원</div>
          </div>
        </div>
      </div>
      ${cells}
      <div class="td c actcell">
        <button class="ib" onclick="openQReceive(${p.id})" title="입고"><i class="ti ti-package-import"></i></button>
        <button class="ib" onclick="openQTransfer(${p.id})" title="이동"><i class="ti ti-transfer"></i></button>
        <button class="ib" onclick="delProduct(${p.id})" title="삭제"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('');

  // 페이지네이션
  bar.style.display = totalPages > 1 ? 'flex' : 'none';
  if (totalPages > 1) {
    const pages = [];
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - curPage) <= 2) pages.push(i);
      else if (pages[pages.length-1] !== '…') pages.push('…');
    }
    bar.innerHTML = `
      <span>${start+1}–${Math.min(start+PAGE_SIZE,totalCount)} / 총 ${totalCount}개</span>
      <div class="pagi-btns">
        <button class="pbtn" onclick="if(${curPage}>1){goPage(${curPage-1});renderStock()}" ${curPage===1?'disabled':''}>‹</button>
        ${pages.map(p => p === '…'
          ? `<span style="padding:3px 6px;color:var(--text2)">…</span>`
          : `<button class="pbtn ${p===curPage?'on':''}" onclick="goPage(${p});renderStock()">${p}</button>`
        ).join('')}
        <button class="pbtn" onclick="if(${curPage}<${totalPages}){goPage(${curPage+1});renderStock()}" ${curPage===totalPages?'disabled':''}>›</button>
      </div>`;
  }
}

// ── 재고 직접 수정 ────────────────────────────────────────
function editStock(pid, bi, el) {
  const p = products.find(x => x.id === pid);
  el.innerHTML = `<input class="snum-in" type="number" value="${p.stock[bi]}" min="0"
    onblur="saveStock(${pid},${bi},this)" onkeydown="if(event.key==='Enter')this.blur()" autofocus>`;
  el.querySelector('input').focus();
}
async function saveStock(pid, bi, input) {
  const val = Math.max(0, parseInt(input.value) || 0);
  const p   = products.find(x => x.id === pid);
  const old = p.stock[bi];
  p.stock[bi] = val;
  renderAll();
  if (val !== old) {
    await api({ action:'updateStock', productId:pid, branchIndex:bi, value:val });
    addLocalLog('edit', p.name, `${BRANCHES[bi]} 재고 수정 ${old}→${val}개`, '');
    toast(`${BRANCHES[bi]} 재고 수정 완료`, 'success');
  }
}

// ── 입고 ─────────────────────────────────────────────────
function updateRPrev() {
  const sel = document.getElementById('rProduct');
  if (!sel || !products.length) return;
  const p   = products.find(x => x.id === parseInt(sel.value));
  if (!p) return;
  const bi  = parseInt(document.getElementById('rBranch').value);
  const qty = parseInt(document.getElementById('rQty').value) || 0;
  document.getElementById('rCur').textContent = `현재 ${BRANCHES[bi]}: ${p.stock[bi]}개`;
  const prev = document.getElementById('rPrev');
  if (qty <= 0) { prev.classList.remove('show'); return; }
  prev.classList.add('show');
  document.getElementById('rPrevBody').innerHTML =
    `<div style="display:flex;justify-content:space-between"><span>입고 후 <strong>${BRANCHES[bi]}</strong></span><span><strong>${p.stock[bi]}→${p.stock[bi]+qty}개</strong> (+${qty})</span></div>`;
}
async function processReceive() {
  if (!products.length) { alert('상품이 없습니다.'); return; }
  const p   = products.find(x => x.id === parseInt(document.getElementById('rProduct').value));
  const bi  = parseInt(document.getElementById('rBranch').value);
  const qty = parseInt(document.getElementById('rQty').value) || 0;
  const memo = document.getElementById('rMemo').value;
  if (qty <= 0) { alert('수량을 입력하세요.'); return; }
  const before = p.stock[bi];
  p.stock[bi] += qty;
  renderAll();
  addLocalLog('receive', p.name, `${BRANCHES[bi]} 입고 +${qty}개 (${before}→${p.stock[bi]})`, memo);
  document.getElementById('rQty').value = '10';
  document.getElementById('rMemo').value = '';
  updateRPrev();
  toast(`입고 완료 — ${BRANCHES[bi]} +${qty}개`, 'success');
  await api({ action:'receiveStock', productId:p.id, productName:p.name, branchIndex:bi, qty, memo });
}

// ── 이동 ─────────────────────────────────────────────────
function updateTPrev() {
  const sel = document.getElementById('tProduct');
  if (!sel || !products.length) return;
  const p    = products.find(x => x.id === parseInt(sel.value));
  if (!p) return;
  const from = parseInt(document.getElementById('tFrom').value);
  const to   = parseInt(document.getElementById('tTo').value);
  const qty  = parseInt(document.getElementById('tQty').value) || 0;
  const prev = document.getElementById('tPrev');
  if (from === to) { prev.className = 'prev-txt err'; prev.textContent = '출발·도착 지점이 같습니다.'; return; }
  if (qty > p.stock[from]) { prev.className = 'prev-txt err'; prev.textContent = `재고 부족 (현재 ${p.stock[from]}개)`; return; }
  prev.className = 'prev-txt';
  prev.textContent = `${BRANCHES[from]}: ${p.stock[from]}→${p.stock[from]-qty} / ${BRANCHES[to]}: ${p.stock[to]}→${p.stock[to]+qty}`;
}
async function processTransfer() {
  if (!products.length) { alert('상품이 없습니다.'); return; }
  const p    = products.find(x => x.id === parseInt(document.getElementById('tProduct').value));
  const from = parseInt(document.getElementById('tFrom').value);
  const to   = parseInt(document.getElementById('tTo').value);
  const qty  = parseInt(document.getElementById('tQty').value) || 0;
  const memo = document.getElementById('tMemo').value;
  if (from === to) { alert('지점이 같습니다.'); return; }
  if (qty <= 0)    { alert('수량을 입력하세요.'); return; }
  if (qty > p.stock[from]) { alert('재고가 부족합니다.'); return; }
  p.stock[from] -= qty; p.stock[to] += qty;
  renderAll();
  addLocalLog('transfer', p.name, `${BRANCHES[from]} → ${BRANCHES[to]} ${qty}개`, memo);
  document.getElementById('tQty').value = '1';
  document.getElementById('tMemo').value = '';
  updateTPrev();
  toast(`이동 완료 — ${BRANCHES[from]} → ${BRANCHES[to]} ${qty}개`, 'success');
  await api({ action:'transferStock', productId:p.id, productName:p.name, fromIndex:from, toIndex:to, qty, memo });
}

    id: Math.max(0, ...products.map(p => p.id)) + 1,

    low:     parseInt(document.getElementById('nLow').value) || 5
  };
  products.push(newProd);
  closeModal(); renderAll();
  toast('상품 추가 완료', 'success');
  const res = await api({ action:'addProduct', name:newProd.name, category:newProd.category, sku:newProd.sku, barcode:newProd.barcode, emoji:newProd.emoji, low:newProd.low, stock });
  if (res && res.newId) newProd.id = res.newId;
}
async function delProduct(pid) {
  if (!confirm('삭제할까요?')) return;
  products = products.filter(p => p.id !== pid);
  renderAll();
  await api({ action:'deleteProduct', productId:pid });
  toast('삭제 완료', 'success');
}

// ── 이미지 모달 ───────────────────────────────────────────
function openImgModal(pid) {
  const p = products.find(x => x.id === pid);
  window._imgPid = pid;
  window._pendingImg = undefined;
  setModal(`
    <h3><i class="ti ti-photo" style="vertical-align:-2px;margin-right:6px"></i>상품 이미지</h3>
    <p class="msub" style="font-size:12px">${p.name}</p>
    <div class="img-tabs">
      <button class="img-tab active" id="itU" onclick="swImgTab('upload')"><i class="ti ti-upload" style="margin-right:4px"></i>이미지</button>
      <button class="img-tab" id="itE" onclick="swImgTab('emoji')"><i class="ti ti-mood-smile" style="margin-right:4px"></i>이모지</button>
    </div>
    <div id="ipUpload">
      <div class="dropzone" id="dz" ondragover="event.preventDefault()" ondrop="handleImgDrop(event)">
        <input type="file" accept="image/*" onchange="handleImgFile(this)">
        ${p.imgUrl
          ? `<div class="dz-pw"><img src="${p.imgUrl}" alt=""><button class="rm" onclick="rmImg()" aria-label="제거"><i class="ti ti-x"></i></button></div>`
          : `<div class="dz-ph"><i class="ti ti-photo-up"></i><span>클릭하거나 드래그</span><span style="font-size:11px;color:var(--text2)">PNG · JPG · WEBP · GIF</span></div>`
        }
      </div>
    </div>
    <div id="ipEmoji" style="display:none">
      <label class="fl" style="margin-top:0">이모지</label>
      <input id="emojiIn" class="fi" value="${p.emoji || '📦'}" style="font-size:20px;width:80px;text-align:center;">
    </div>
    <div class="mrow">
      <button class="sec-btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveImg()" style="justify-content:center;">저장</button>
    </div>`);
}
function swImgTab(t) {
  document.getElementById('itU').classList.toggle('active', t==='upload');
  document.getElementById('itE').classList.toggle('active', t==='emoji');
  document.getElementById('ipUpload').style.display = t==='upload' ? 'block' : 'none';
  document.getElementById('ipEmoji').style.display  = t==='emoji'  ? 'block' : 'none';
}
function handleImgFile(input) { const f = input.files[0]; if (f) readImg(f); }
function handleImgDrop(e) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) readImg(f); }
function readImg(file) {
  const r = new FileReader();
  r.onload = ev => {
    window._pendingImg = ev.target.result;
    document.getElementById('dz').innerHTML =
      `<input type="file" accept="image/*" onchange="handleImgFile(this)">
       <div class="dz-pw"><img src="${ev.target.result}" alt=""><button class="rm" onclick="rmImg()" aria-label="제거"><i class="ti ti-x"></i></button></div>`;
  };
  r.readAsDataURL(file);
}
function rmImg() {
  window._pendingImg = null;
  document.getElementById('dz').innerHTML =
    `<input type="file" accept="image/*" onchange="handleImgFile(this)">
     <div class="dz-ph"><i class="ti ti-photo-up"></i><span>클릭하거나 드래그</span></div>`;
}
function saveImg() {
  const p = products.find(x => x.id === window._imgPid);
  if (document.getElementById('ipEmoji').style.display !== 'none') {
    p.emoji = document.getElementById('emojiIn').value || '📦';
    p.imgUrl = null;
  } else if (window._pendingImg !== undefined) {
    p.imgUrl = window._pendingImg || null;
  }
  window._pendingImg = undefined;
  closeModal(); renderAll();
  toast('이미지 저장 완료', 'success');
}

// ── 탭 전환 ───────────────────────────────────────────────
function switchTab(tab, btn) {
  curTab = tab;
  ['stock','receive','transfer','log'].forEach(t =>
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none'
  );
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'receive' || tab === 'transfer') populateSelects();
  if (tab === 'log') loadLogs();
}

function populateSelects() {
  ['rProduct','tProduct'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = products.map(p => `<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');
  });
  updateRPrev(); updateTPrev();
}
